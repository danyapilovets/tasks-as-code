name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS catch path-separator and line-ending regressions in
        # the YAML round trip; the full Python range catches syntax drift.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        env:
          # Turn any read or write that omits an encoding into a failure. The
          # platform default is cp1252 on Windows, which mangles non-latin task
          # text — a bug that otherwise only surfaces on one runner.
          PYTHONWARNDEFAULTENCODING: "1"
        run: |
          set -o pipefail
          if ! python -X warn_default_encoding -m pytest -q --tb=short -W error::EncodingWarning 2>&1 | tee pytest.log; then
            # Failures become annotations, which show up on the pull request diff
            # and are readable without downloading the whole log.
            grep -E '^(FAILED|ERROR|E   )' pytest.log | head -30 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
            exit 1
          fi

  self-check:
    # The tool must be able to bootstrap and validate a project end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Bootstrap and drive a throwaway project
        run: |
          set -euo pipefail
          mkdir -p /tmp/demo && cd /tmp/demo
          tasc init --name "CI Demo"
          grep -q 'tasks/INDEX.md' .gitignore
          tasc new api --summary "Ship the thing" --priority High
          tasc next --json
          tasc mark api-001 in_progress --owner ci-agent
          # Quoted so shellcheck reads it as the subcommand, not a loop keyword.
          tasc "done" api-001 --note "done in CI"
          tasc validate
          tasc stale
          test -f tasks/INDEX.md
      - name: Shards must be disjoint and cover the backlog
        run: |
          set -euo pipefail
          mkdir -p /tmp/shards && cd /tmp/shards
          tasc init --name "Shards"
          for n in $(seq 1 12); do tasc new api --summary "Task $n" >/dev/null; done
          total=$(tasc list --json --status todo | python -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          sum=0
          for k in 1 2 3; do
            got=$(tasc next --json --limit 99 --shard "$k/3" | python -c 'import json,sys; print(len(json.load(sys.stdin)["next"]))')
            sum=$((sum + got))
          done
          test "$sum" -eq "$total"
      - name: A custom done_dir needs no file moves
        run: |
          set -euo pipefail
          mkdir -p /tmp/legacy && cd /tmp/legacy
          tasc init --name "Legacy" --done-dir docs/changelog
          tasc new api --summary "Adopt tasc" >/dev/null
          tasc "done" api-001 --note "adopted"
          ls docs/changelog/*.md

      - name: The commit-msg hook blocks a real commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate && cd /tmp/gate
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          tasc init --name "Gate"
          tasc install-hook
          echo change > file.txt
          git add -A

          # No task named: the commit must not happen.
          if git commit -q -m "wip"; then
            echo "::error::the hook let an unreferenced commit through"
            exit 1
          fi
          tasc mark core-001 in_progress
          git add -A
          git commit -q -m "core-001: adopt the gate"
          git commit -q --allow-empty -m "chore: tidy [skip-task]"
          test "$(git rev-list --count HEAD)" -eq 2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
