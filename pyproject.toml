[project]
name = "tasks-as-code"
version = "0.1.0"
description = "Git-native backlog for AI coding agents: YAML tasks, deterministic next-task selection, JSON output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Danylo Pilovets", email = "w.pilovets@gmail.com" }]
keywords = ["tasks", "backlog", "ai-agents", "yaml", "cli", "jira", "tasks-as-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13",
]

[project.optional-dependencies]
jira = ["requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/danyapilovets/tasks-as-code"
Repository = "https://github.com/danyapilovets/tasks-as-code"
Issues = "https://github.com/danyapilovets/tasks-as-code/issues"
Changelog = "https://github.com/danyapilovets/tasks-as-code/blob/main/CHANGELOG.md"

[project.scripts]
tasc = "tasks_as_code.cli:app"

[build-system]
# 77 is the first release that understands the SPDX `license` expression and
# `license-files` above (PEP 639). An older setuptools would fail on them, so the
# declared minimum has to match what the metadata actually needs.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tasks_as_code = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tasks_as_code --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["tasks_as_code"]
# Entry shim for `python -m tasks_as_code`; verified by a subprocess test, which
# runs outside this process and so cannot be measured here.
omit = ["*/tasks_as_code/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built around calling Option()/Argument() in parameter defaults.
"src/tasks_as_code/cli.py" = ["B008"]
